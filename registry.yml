# Skill Registry
# Each entry maps a canonical skill file to one or more harness install targets.
# Paths prefixed with ~/ are absolute. Paths without ~/ are relative to the project root
# where install.sh is run (for project-scoped installs).
#
# mode: symlink (default) — changes to source are immediately live
# mode: copy — use when the target environment cannot follow symlinks
#
# Note: QSOS workflow skills (qsos-*) have moved to the qsos/ repository.
# Deploy them with: cd /path/to/qsos && ./deploy.sh

skills:
  # Domain-specific tools (not QSOS chain skills)
  - name: vscode-ext-load
    source: skills/workflow/vscode-ext-load.md
    install_to:
      - path: ~/.claude/commands/vscode-ext-load.md
        mode: symlink

  - name: vscode-ext-test
    source: skills/workflow/vscode-ext-test.md
    install_to:
      - path: ~/.claude/commands/vscode-ext-test.md
        mode: symlink

  - name: prerequisite-map
    source: skills/thinking/prerequisite-map.md
    install_to:
      - path: ~/.claude/commands/prerequisite-map.md
        mode: symlink

