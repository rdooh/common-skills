# Skill Registry
# Each entry maps a canonical skill file to one or more harness install targets.
# Paths prefixed with ~/ are absolute. Paths without ~/ are relative to the project root
# where install.sh is run (for project-scoped installs).
#
# mode: symlink (default) — changes to source are immediately live
# mode: copy — use when the target environment cannot follow symlinks
#
# Note: QSOS workflow skills (qsos-*) have moved to the qsos/ repository.
# Deploy them with: cd /path/to/qsos && ./deploy.sh

skills:
  # Domain-specific tools (not QSOS chain skills)
  - name: vscode-ext-load
    source: skills/workflow/vscode-ext-load.md
    install_to:
      - path: ~/.claude/commands/vscode-ext-load.md
        mode: symlink

  - name: vscode-ext-test
    source: skills/workflow/vscode-ext-test.md
    install_to:
      - path: ~/.claude/commands/vscode-ext-test.md
        mode: symlink

  - name: prerequisite-map
    source: skills/thinking/prerequisite-map.md
    install_to:
      - path: ~/.claude/commands/prerequisite-map.md
        mode: symlink

  - name: verify-with-evidence
    source: skills/workflow/verify-with-evidence.md
    install_to:
      - path: ~/.claude/commands/verify-with-evidence.md
        mode: copy
      - path: ~/.cursor/skills/verify-with-evidence.md
        mode: copy
      - path: ~/.gemini/config/skills/verify-with-evidence.md
        mode: copy

  - name: mandate
    source: skills/workflow/mandate.md
    install_to:
      - path: ~/.claude/commands/mandate.md
        mode: copy
      - path: ~/.cursor/skills/mandate.md
        mode: copy
      - path: ~/.gemini/config/skills/mandate.md
        mode: copy
      - path: ~/.gemini/config/skills/mandate/SKILL.md
        mode: copy

  - name: mandate-baseline
    source: skills/workflow/mandate-baseline.md
    install_to:
      - path: ~/.claude/commands/mandate-baseline.md
        mode: copy
      - path: ~/.cursor/skills/mandate-baseline.md
        mode: copy
      - path: ~/.gemini/config/skills/mandate-baseline.md
        mode: copy
      - path: ~/.gemini/config/skills/mandate/mandate-baseline.md
        mode: copy

  - name: verifier-agent
    source: agents/verifier.md
    install_to:
      - path: ~/.claude/agents/verifier.md
        mode: copy

